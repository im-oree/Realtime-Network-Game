<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Grid Wars logo">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="56" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="40" fill="url(#grid)" opacity="0.55"/>

  <!-- crosshair reticle -->
  <g filter="url(#soft)">
    <circle cx="256" cy="236" r="96" fill="none" stroke="url(#glowCyan)" stroke-width="10"/>
    <circle cx="256" cy="236" r="8" fill="#22d3ee"/>
    <path d="M 256 108 v 52 M 256 312 v 52 M 128 236 h 52 M 332 236 h 52"
          stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- tracer -->
  <path d="M 132 130 Q 200 168 236 216" fill="none" stroke="#f97316" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="2 16" opacity="0.9"/>

  <!-- players -->
  <g>
    <circle cx="128" cy="126" r="18" fill="#f97316" stroke="#0b1120" stroke-width="4"/>
    <circle cx="384" cy="346" r="18" fill="#14b8a6" stroke="#0b1120" stroke-width="4"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="432" text-anchor="middle" fill="#e2e8f0"
        font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="64"
        font-weight="800" letter-spacing="10">GRID WARS</text>
  <text x="258" y="466" text-anchor="middle" fill="#64748b"
        font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15"
        font-weight="600" letter-spacing="6">REAL-TIME ARENA SHOOTER</text>
</svg>
